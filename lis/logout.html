<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Logout - Uganda Land Management System</title>
    <link rel="stylesheet" href="styles/main.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1 class="login-title">Logging Out</h1>
                <p class="login-subtitle">Thank you for using the Uganda Land Management System</p>
            </div>
            
            <div style="text-align: center; padding: 2rem 0;">
                <div style="margin-bottom: 2rem;">
                    <div style="width: 60px; height: 60px; border: 4px solid var(--muted); border-top: 4px solid var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto;"></div>
                </div>
                <p style="color: var(--muted-foreground); margin-bottom: 2rem;">
                    You have been successfully logged out. Redirecting to login page...
                </p>
                <a href="index.html" class="btn btn-primary">Return to Login</a>
            </div>
        </div>
    </div>

    <style>
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>

    <script>
        // Clear any stored session data
        localStorage.removeItem('currentUser');
        sessionStorage.clear();
        
        // Redirect to login page after 3 seconds
        setTimeout(() => {
            window.location.href = 'index.html';
        }, 3000);
    </script>
</body>
</html>
